<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média - Portal do Calouro</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        
        /* Cabeçalho principal */
        header { background-color: #0056b3; color: white; padding: 15px; display: flex; align-items: center; justify-content: center; }
       
        /* Logo central no cabeçalho (Imagem) */
        .logo img { 
            height: 45px; 
            width: auto; 
            display: block; 
        }

        /* Contêiner para manter a cápsula flutuando no topo */
        .nav-wrapper {
            display: flex;
            justify-content: center;
            padding: 20px 10px;
            position: sticky;
            top: 0;
            z-index: 998;
        }

        /* Barra de Navegação em Cápsula */
        .capsule-nav {
            background-color: #004085; 
            display: flex;
            border-radius: 50px; 
            padding: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow-x: auto;
            max-width: 95%;
        }
        .capsule-nav a {
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            border-radius: 50px; 
            transition: background-color 0.2s, color 0.2s;
            white-space: nowrap;
        }
        .capsule-nav a:hover { background-color: #002752; }
        
        /* Aba ativa (destacada em branco) */
        .capsule-nav a.active {
            background-color: #ffffff; 
            color: #004085; 
        }
        
        /* Conteúdo da Calculadora */
        .content { padding: 20px; max-width: 500px; margin: 20px auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        h2, h3 { color: #0056b3; margin-top: 0; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        
        .calc-action-btn { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .calc-action-btn:hover { background-color: #004085; }

        /* Área de resultado  */
        .result-box { margin-top: 20px; padding: 15px; background-color: #e2eef9; border-left: 5px solid #0056b3; border-radius: 4px; display: block; }
        .result-box p { margin: 0; color: #004085; font-weight: bold; }

        /* Botão Flutuante do Chatbot */
        .floating-btn { position: fixed; bottom: 20px; right: 20px; background-color: #0056b3; color: white; padding: 15px 25px; border-radius: 50px; text-decoration: none; font-size: 16px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
        .floating-btn:hover { background-color: #004085; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Logo GIC">
        </a>
    </header>

   <div class="nav-wrapper">
        <nav class="capsule-nav">
            <a href="index.html">Início</a>
            <a href="tutoriais.html">Tutoriais</a>
            <a href="disciplinas.html">Disciplinas</a>
            <a href="calculadora.html" class="active">Calculadora</a>
        </nav>
    </div>

    <main class="content">
        <div class="card">
            <h3>Simule suas Notas</h3>
            <p style="color: #666; margin-bottom: 20px; font-size: 14px;">Preencha suas notas da AB1 e AB2 para saber quanto precisa na reavaliação ou final.</p>
            
            <div class="form-group">
                <label for="ab1">Nota AB1</label>
                <input type="number" id="ab1" placeholder="Ex: 6.5">
            </div>
            
            <div class="form-group">
                <label for="ab2">Nota AB2</label>
                <input type="number" id="ab2" placeholder="Ex: 5.0">
            </div>

            <div class="form-group">
                <label for="reav">Nota de Reavaliação (Opcional)</label>
                <input type="number" id="reav" placeholder="Ex: 7.0">
            </div>
            
            <button class="calc-action-btn" type="button">Calcular Média</button>

            <div class="result-box">
                <p>Situação: Em Prova Final</p>
                <p>Você precisa tirar no mínimo 6.5 na prova final para ser aprovado.</p>
            </div>
        </div>
    </main>

    <a href="chat.html" class="floating-btn">💬 Chatbot</a>

</body>
</html>
