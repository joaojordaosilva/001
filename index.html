<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #0056b3; color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        
        /* Menu Lateral*/
        #menu-toggle { display: none; }
        .sidebar { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background-color: #333; color: white; transition: 0.3s; padding-top: 60px; z-index: 1000; box-shadow: 2px 0 5px rgba(0,0,0,0.5); }
        .sidebar a { display: block; color: white; padding: 15px 20px; text-decoration: none; font-size: 18px; border-bottom: 1px solid #444; }
        .sidebar a:hover { background-color: #575757; }
        #menu-toggle:checked ~ .sidebar { left: 0; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 30px; color: white; cursor: pointer; }
        
        /*Notícias */
        .news-section { padding: 20px; }
        .carousel { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; scroll-snap-type: x mandatory; }
        .news-card { min-width: 260px; scroll-snap-align: start; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; text-decoration: none; color: black; }
        .news-card img { width: 100%; height: 150px; object-fit: cover; background-color: #ddd; }
        .news-card div { padding: 15px; }
        
        /* Botão do Chatbot */
        .chat-btn { position: fixed; bottom: 20px; right: 20px; background-color: #0c0268; color: white; padding: 15px 25px; border-radius: 50px; text-decoration: none; font-size: 16px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
        .chat-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

   
    <input type="checkbox" id="menu-toggle">
    
    <nav class="sidebar">
        <label for="menu-toggle" class="close-btn">&times;</label>
        <a href="sobre.html">Sobre nós</a>
    </nav>

    <header>
        <label for="menu-toggle" class="menu-btn">&#9776;</label>
        <h2>Instituto de Computação</h2>
        <div style="width: 24px;"></div> <!-- Espaçador para centralizar o título -->
    </header>

    <main class="news-section">
        <h3>Mural de Notícias</h3>
        <div class="carousel">
            
            <a href="https://ic.ufal.br/pt-br" class="news-card" target="_blank">
                <div>
                    <h4>Bem-vindo ao semestre!</h4>
                    <p>Confira o calendário acadêmico para os calouros.</p>
                </div>
            </a>
          
        </div>
    </main>

    <a href="chat.html" class="chat-btn">💬 Falar com Chatbot</a>

</body>
</html>
